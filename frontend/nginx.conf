# portal-web: static Angular bundle, unprivileged nginx on 8080 (LLD, Runtime container).
# Each request gets a fresh CSP nonce ($request_id) written into index.html for Angular's
# and AG Grid's runtime <style> tags, so styles need no 'unsafe-inline'.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";

  add_header Content-Security-Policy $csp always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /index.html {
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '__CSP_NONCE__' $request_id;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }

  # Mounted from a ConfigMap per environment; never cached.
  location = /assets/config.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Bundles and fonts from ng build carry a content hash in their names (main-ZYVVILNR.js,
  # media/carlito-latin-400-normal-CJXBN5SS.woff2), so a changed file gets a new URL.
  location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|png|svg|ico)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Files from public/ keep their names (favicon.ico, assets/amicorp-logo.png): browsers check
  # for a newer copy on each use, which the ETag keeps cheap.
  location ~* \.(?:js|css|woff2?|ttf|png|svg|ico)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The UDAP landing page (public/udap/): signed-out visitors to the portal's address land here
  # (authGuard). Plain HTML, CSS and JS under the same CSP; /udap/ serves its index.html.
  location /udap/ {
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
