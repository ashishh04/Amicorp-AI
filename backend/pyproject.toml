[project]
name = "amicorp-platform-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "redis>=5.2",
    "pyjwt[crypto]>=2.10",
    "structlog>=24.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the local PostgreSQL and Redis from dev/docker-compose.yml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is declared in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "app.core.authz.permit"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/db/migrations/**" = ["E501"]
