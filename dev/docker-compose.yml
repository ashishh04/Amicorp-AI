# Local infrastructure for platform-api: PostgreSQL 16 (matches RDS in PRD) and Redis 7 (matches DCS).
# Ports are bound to 127.0.0.1 only, so nothing is reachable from the network.
#
#   docker compose -f dev/docker-compose.yml up -d
#   docker compose -f dev/docker-compose.yml down        # stop (data kept)
#   docker compose -f dev/docker-compose.yml down -v     # stop and delete the data
name: amicorp-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: amc
      POSTGRES_PASSWORD: amc_local_only
      POSTGRES_DB: amicorp
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amc -d amicorp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # Queue and lock store only: nothing in it needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
